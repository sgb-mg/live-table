<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Senarai No Pacak Kolam A SGB</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  background: #ffffff;

  font-family: Arial, Helvetica, sans-serif;

  color: #000000;
}


/* =========================================================
   STATUS
   ========================================================= */

#status {
  margin: 0;
  padding: 2px 4px 8px 4px;

  font-size: 13px;
  line-height: 16px;

  color: #777777;
}


/* =========================================================
   TABLE CONTAINER
   ========================================================= */

.table-container {
  width: 100%;
  max-width: 100%;

  overflow-x: auto;
  overflow-y: hidden;

  margin: 0;
  padding: 0;
}


/* =========================================================
   SHEET
   ========================================================= */

.sheet {
  display: block;

  width: max-content;

  margin: 0;
  padding: 0;

  background: #ffffff;
}


/* =========================================================
   TABLE
   ========================================================= */

.sheet table {
  border-collapse: collapse;
  border-spacing: 0;

  table-layout: fixed;

  width: max-content;

  margin: 0;
  padding: 0;

  background: #ffffff;
}


/* =========================================================
   CELLS
   ========================================================= */

.sheet td {
  box-sizing: border-box;

  margin: 0;
  padding: 3px 6px;

  border: 1px solid #777777;

  font-family: Arial, Helvetica, sans-serif;

  line-height: normal;

  overflow: hidden;

  vertical-align: middle;

  background-clip: padding-box;
}


/* =========================================================
   MERGED CELLS
   ========================================================= */

.sheet td[colspan],
.sheet td[rowspan] {
  overflow: hidden;
}


/* =========================================================
   SCROLLBAR
   ========================================================= */

.table-container::-webkit-scrollbar {
  height: 10px;
}

.table-container::-webkit-scrollbar-track {
  background: #eeeeee;
}

.table-container::-webkit-scrollbar-thumb {
  background: #999999;
  border-radius: 5px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

  #status {
    font-size: 12px;
  }

  .sheet td {
    padding: 2px 4px;
  }
}

</style>

</head>


<body>


<div id="status">
  Loading...
</div>


<div class="table-container">

  <div id="table"></div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxs3pvu4QUPxHRdOu7sLILk88GkOzEAA5e-l7JUUNapAC69u_UL412E2uEwHdSf5Wjb/exec";


async function updateTable() {

  try {

    const response =
      await fetch(
        API_URL + "?t=" + Date.now()
      );


    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }


    const data =
      await response.json();


    document.getElementById("table")
      .innerHTML = data.html;


    document.getElementById("status")
      .textContent =
        "Last updated: " + data.updated;


  } catch (error) {

    console.error(error);

    document.getElementById("status")
      .textContent =
        "Update failed";

  }

}


updateTable();

setInterval(
  updateTable,
  5000
);

</script>

</body>

</html>
