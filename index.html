<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Live Table</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    color: #000000;
  }

  #status {
    display: block;
    margin: 0 0 8px 0;
    padding: 0;

    font-size: 13px;
    line-height: 18px;
    color: #777777;
  }

  .table-container {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: visible;

    margin: 0;
    padding: 0;

    -webkit-overflow-scrolling: touch;
  }

  .sheet {
    display: inline-block;
    width: max-content;
    min-width: max-content;

    margin: 0;
    padding: 0;

    background: #ffffff;
  }

  .sheet table {
    border-collapse: collapse;
    border-spacing: 0;

    table-layout: fixed;

    width: max-content;
    min-width: max-content;

    margin: 0;
    padding: 0;

    background: #ffffff;
  }

  .sheet col {
    box-sizing: border-box;
  }

  .sheet tr {
    margin: 0;
    padding: 0;
  }

  .sheet td {
    box-sizing: border-box;

    margin: 0;
    padding: 3px 6px;

    border: 1px solid #777777;

    font-family: Arial, Helvetica, sans-serif;
    line-height: normal;

    overflow: hidden;

    vertical-align: middle;

    background-clip: padding-box;

    text-rendering: geometricPrecision;
  }

  .sheet td[colspan],
  .sheet td[rowspan] {
    overflow: hidden;
  }

  .table-container::-webkit-scrollbar {
    height: 12px;
  }

  .table-container::-webkit-scrollbar-track {
    background: #eeeeee;
  }

  .table-container::-webkit-scrollbar-thumb {
    background: #999999;
    border-radius: 6px;
  }

  .table-container::-webkit-scrollbar-thumb:hover {
    background: #777777;
  }

  @media (max-width: 600px) {
    body {
      padding: 5px;
    }

    #status {
      font-size: 12px;
      margin-bottom: 5px;
    }

    .sheet td {
      padding: 2px 4px;
    }
  }
</style>

</head>

<body>

<div id="status">Loading...</div>

<div class="table-container">
  <div id="table"></div>
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxs3pvu4QUPxHRdOu7sLILk88GkOzEAA5e-l7JUUNapAC69u_UL412E2uEwHdSf5Wjb/exec";


async function updateTable() {

  try {

    const response =
      await fetch(API_URL + "?t=" + Date.now());

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    document.getElementById("table").innerHTML =
      data.html;

    document.getElementById("status").textContent =
      "Last updated: " + data.updated;

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "Update failed";

  }
}


updateTable();

setInterval(updateTable, 5000);

</script>

</body>
</html>
