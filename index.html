<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Table</title>

  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    #status {
      font-size: 13px;
      color: #777;
      margin-bottom: 8px;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f2f2f2;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }
  </style>
</head>

<body>

<div id="status">Loading...</div>

<div class="table-container">
  <div id="table"></div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyI1bRWbEuZYIQaXp0h6U2FkW0OtRySj4Y9XEFrutZ6iByFUVNkUcuwnA6TvqVYozKz3A/exec";

async function updateTable() {

  try {

    const response = await fetch(
      API_URL + "?t=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    let html = "<table>";

    data.forEach((row, rowIndex) => {

      html += "<tr>";

      row.forEach(cell => {

        const tag = rowIndex === 0 ? "th" : "td";

        html += `<${tag}>${cell ?? ""}</${tag}>`;

      });

      html += "</tr>";

    });

    html += "</table>";

    document.getElementById("table").innerHTML = html;

    document.getElementById("status").textContent =
      "Last updated: " + new Date().toLocaleTimeString();

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "Unable to update";

  }
}

// Load immediately
updateTable();

// Check for changes every 5 seconds
setInterval(updateTable, 5000);

</script>

</body>
</html>
