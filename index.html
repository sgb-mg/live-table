<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Live Table</title>

  <style>
    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #000000;
      font-size: 14px;
      overflow-x: hidden;
    }


    /* =====================================================
       STATUS
    ===================================================== */

    #status {
      display: block;

      margin: 0;
      padding: 4px 6px;

      height: 26px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      line-height: 18px;

      color: #777777;

      background: #ffffff;
    }


    /* =====================================================
       TABLE CONTAINER
    ===================================================== */

    .table-container {
      display: block;

      width: 100%;
      max-width: 100%;

      margin: 0;
      padding: 0;

      overflow-x: auto;
      overflow-y: visible;

      -webkit-overflow-scrolling: touch;
    }


    /* =====================================================
       TABLE AREA
    ===================================================== */

    #table {
      display: block;

      width: max-content;
      min-width: 0;

      margin: 0;
      padding: 0;

      background: #ffffff;
    }


    /* =====================================================
       SHEET
    ===================================================== */

    .sheet-wrapper,
    .sheet {
      display: block;

      width: max-content;
      min-width: 0;

      margin: 0;
      padding: 0;

      background: #ffffff;
    }


    /* =====================================================
       TABLE
       
       IMPORTANT:
       Do NOT force borders here.
       Do NOT force padding here.
       Do NOT force colors here.
       Apps Script supplies the actual cell formatting.
    ===================================================== */

    .sheet-table,
    .sheet table {
      display: table;

      border-collapse: collapse;
      border-spacing: 0;

      table-layout: fixed;

      width: max-content;
      min-width: 0;

      margin: 0;
      padding: 0;

      background: #ffffff;
    }


    /* =====================================================
       COLUMNS
    ===================================================== */

    .sheet-table col,
    .sheet table col {
      box-sizing: border-box;
    }


    /* =====================================================
       ROWS
    ===================================================== */

    .sheet-table tr,
    .sheet table tr {
      margin: 0;
      padding: 0;
    }


    /* =====================================================
       CELLS
       
       Apps Script sends:
       - background
       - color
       - font size
       - font weight
       - font style
       - alignment
       - border
       - rowspan
       - colspan
    ===================================================== */

    .sheet-table td,
    .sheet table td {
      box-sizing: border-box;

      margin: 0;

      font-family: Arial, Helvetica, sans-serif;

      line-height: normal;

      background-clip: padding-box;

      text-rendering: geometricPrecision;

      vertical-align: middle;
    }


    /* =====================================================
       DO NOT ADD EXTRA BORDERS
       
       The Apps Script decides which cells have borders.
    ===================================================== */

    .sheet-table td,
    .sheet table td {
      border-style: inherit;
      border-width: inherit;
      border-color: inherit;
    }


    /* =====================================================
       ZON A / ZON B
    ===================================================== */

    .sheet-table td[style*="white-space:nowrap"],
    .sheet table td[style*="white-space:nowrap"] {
      overflow: visible;
    }


    /* =====================================================
       SCROLLBAR
    ===================================================== */

    .table-container::-webkit-scrollbar {
      height: 12px;
    }

    .table-container::-webkit-scrollbar-track {
      background: #eeeeee;
    }

    .table-container::-webkit-scrollbar-thumb {
      background: #999999;
      border-radius: 6px;
    }

    .table-container::-webkit-scrollbar-thumb:hover {
      background: #777777;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      #status {
        height: 24px;

        padding: 3px 5px;

        font-size: 11px;
        line-height: 18px;
      }

      .table-container {
        width: 100%;
        overflow-x: auto;
      }

      #table {
        width: max-content;
      }

    }
  </style>
</head>


<body>

  <!-- =====================================================
       STATUS
  ===================================================== -->

  <div id="status">
    Loading...
  </div>


  <!-- =====================================================
       TABLE
  ===================================================== -->

  <div class="table-container">
    <div id="table"></div>
  </div>


  <script>

    // =====================================================
    // GOOGLE APPS SCRIPT URL
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxs3pvu4QUPxHRdOu7sLILk88GkOzEAA5e-l7JUUNapAC69u_UL412E2uEwHdSf5Wjb/exec";


    // =====================================================
    // UPDATE TABLE
    // =====================================================

    async function updateTable() {

      const status =
        document.getElementById("status");

      const table =
        document.getElementById("table");


      try {

        status.textContent =
          "Updating...";


        const response =
          await fetch(
            API_URL +
            "?t=" +
            Date.now(),
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        if (
          !data ||
          !data.html
        ) {

          throw new Error(
            "Invalid table data"
          );

        }


        // -------------------------------------------------
        // Replace table
        // -------------------------------------------------

        table.innerHTML =
          data.html;


        // -------------------------------------------------
        // Update status
        // -------------------------------------------------

        if (data.updated) {

          status.textContent =
            "Last updated: " +
            data.updated;

        } else {

          status.textContent =
            "Live";

        }


      } catch (error) {

        console.error(
          "Table update error:",
          error
        );


        status.textContent =
          "Update failed";


      }

    }


    // =====================================================
    // INITIAL LOAD
    // =====================================================

    updateTable();


    // =====================================================
    // AUTO REFRESH
    // =====================================================

    setInterval(
      updateTable,
      5000
    );

  </script>

</body>
</html>
