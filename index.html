<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Live Table</title>

<style>

body {
  margin: 0;
  padding: 10px;
  background: white;
  font-family: Arial, sans-serif;
}

#status {
  color: #777;
  font-size: 13px;
  margin-bottom: 8px;
}

.table-container {
  width: 100%;
  overflow-x: auto;
}

.sheet {
  display: inline-block;
}

.sheet table {
  border-collapse: collapse;
  table-layout: auto;
}

.sheet td {
  height: 28px;
  min-width: 38px;
  box-sizing: border-box;
}

</style>
</head>

<body>

<div id="status">Loading...</div>

<div class="table-container">
  <div id="table"></div>
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxs3pvu4QUPxHRdOu7sLILk88GkOzEAA5e-l7JUUNapAC69u_UL412E2uEwHdSf5Wjb/exec";


async function updateTable() {

  try {

    const response =
      await fetch(API_URL + "?t=" + Date.now());

    const data = await response.json();

    document.getElementById("table").innerHTML =
      data.html;

    document.getElementById("status").textContent =
      "Last updated: " + data.updated;

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "Update failed";

  }
}


updateTable();

setInterval(updateTable, 5000);

</script>

</body>
</html>
